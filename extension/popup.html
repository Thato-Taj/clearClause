<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>ClearClause</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <a id="brandLink" class="brand" href="#" title="Open the ClearClause website">
      <img src="icons/icon-32.png" width="26" height="26" alt="">
      <span class="wordmark">Clear<span>Clause</span></span>
    </a>
    <button id="settingsBtn" class="icon-btn" type="button" aria-label="Access key settings" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></svg>
    </button>
  </header>
  <p id="status" class="status" aria-live="polite"></p>

  <section id="settings" class="panel" hidden aria-labelledby="settingsTitle">
    <h2 id="settingsTitle">Access key</h2>
    <p class="hint">Add a key to use your plan here and save every check to your reports. Create one on your account page, then paste it below.</p>
    <label for="accessKey" class="sr-only">Access key</label>
    <input id="accessKey" type="password" autocomplete="off" spellcheck="false" placeholder="cc_…">
    <div class="row">
      <button id="saveKeyBtn" class="btn primary" type="button">Save key</button>
      <button id="removeKeyBtn" class="btn ghost" type="button" hidden>Remove</button>
      <a id="getKeyLink" class="link push" href="#">Get a key</a>
    </div>
    <p id="keyMessage" class="hint" role="status"></p>
  </section>

  <main id="scanView">
    <div id="notice" class="notice" hidden></div>
    <form id="scanForm" novalidate>
      <label for="docText" class="label">Terms, contract or policy</label>
      <textarea id="docText" rows="7" placeholder="Paste the text here, or press “Use this page”."></textarea>
      <p id="grabNote" class="hint" role="status"></p>
      <div class="row">
        <button id="grabBtn" type="button" class="btn secondary">Use this page</button>
        <label class="lang push">
          <span class="sr-only">Language for the report</span>
          <select id="language"></select>
        </label>
      </div>
      <button id="analyzeBtn" type="submit" class="btn primary block">Check it</button>
    </form>
    <div id="loading" class="loading" hidden role="status">
      <span class="spinner" aria-hidden="true"></span>
      <span>Checking it against South African law. This can take up to a minute — keep this window open.</span>
    </div>
    <div id="error" class="alert" hidden role="alert"></div>
  </main>

  <section id="results" hidden aria-labelledby="resultTitle"></section>

  <footer class="foot">ClearClause gives guidance, not legal advice.</footer>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
