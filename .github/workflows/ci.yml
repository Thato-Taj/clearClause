# Continuous integration: every push and pull request must pass these checks.
# Deployment (CD) is done by Vercel (frontend) and Render (backend), which build from GitHub on push.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Runs with SKIP_DOTENV and FIREBASE_DISABLED (see package.json): no secrets, no network.
      - run: npm test

  frontend:
    name: Frontend lint, type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # PageProps / LayoutProps are generated by Next, so generate them before type-checking a fresh checkout.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build

  extension:
    name: Browser extension checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Scripts parse
        run: node --check popup.js && node --check config.js
      - name: Manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
      - name: No raw-HTML sinks (the popup builds its DOM with textContent only)
        run: "! grep -nE '\\.(innerHTML|outerHTML)\\s*\\+?=|insertAdjacentHTML\\s*\\(|document\\.write(ln)?\\s*\\(' popup.js"
